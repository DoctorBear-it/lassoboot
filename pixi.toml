[project]
name = "lassoboot"
version = "0.1.0"
description = "Parametric Bootstrap for Lasso Regression with Measurement Uncertainty"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
r-base = ">=4.4,<4.5"
r-glmnet = ">=4.1"
r-matrix = "*"
r-matrixstats = ">=0.63"
r-tibble = "*"
r-dplyr = ">=1.1"
r-tidyr = ">=1.3"
r-purrr = ">=1.0"
r-rlang = ">=1.1"
r-vctrs = ">=0.6"
r-cli = ">=3.6"
r-generics = "*"
r-ggplot2 = ">=3.4"
r-scales = "*"
r-withr = ">=2.5"
# Suggests
r-lme4 = ">=1.1_30"
r-future = "*"
r-furrr = "*"
r-progressr = "*"
# Dev
r-devtools = "*"
r-roxygen2 = ">=7.3"
r-testthat = ">=3.0"
r-vdiffr = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-pkgdown = "*"
r-covr = "*"
r-lintr = "*"
r-styler = "*"
r-usethis = "*"
# Build/system
cairo = "*"
freetype = "*"
pkg-config = "*"

[tasks]
bootstrap  = { cmd = "Rscript bootstrap.R" }
document   = { cmd = "Rscript -e \"roxygen2::roxygenise('.')\"", depends-on = ["bootstrap"] }
test       = { cmd = "Rscript -e \"devtools::test('.')\"", depends-on = ["bootstrap"] }
check      = { cmd = "Rscript -e \"devtools::check('.')\"", depends-on = ["bootstrap"] }
check-fast = { cmd = "Rscript -e \"devtools::check('.', args = c('--no-vignettes', '--no-examples'))\"", depends-on = ["bootstrap"] }
build      = { cmd = "Rscript -e \"devtools::build('.')\"", depends-on = ["bootstrap"] }
docs       = { cmd = "Rscript -e \"pkgdown::build_site('.')\"", depends-on = ["bootstrap"] }
install    = { cmd = "Rscript -e \"devtools::install('.')\"", depends-on = ["bootstrap"] }
libpaths   = { cmd = "Rscript -e \".libPaths()\"", depends-on = ["bootstrap"] }
rstudio    = { cmd = "rstudio lassoboot.Rproj", env = { RSTUDIO_WHICH_R = "${CONDA_PREFIX}/bin/R.exe" } }
lint       = { cmd = "Rscript -e \"lintr::lint_package('.')\"", depends-on = ["bootstrap"] }
style      = { cmd = "Rscript -e \"styler::style_pkg()\"", depends-on = ["bootstrap"] }

[feature.publish.dependencies]
r-rhub = "*"

[feature.publish.tasks]
rhub-check  = { cmd = "Rscript -e \"rhub::rhub_check()\"", depends-on = ["bootstrap"] }
submit-cran = { cmd = "Rscript -e \"devtools::submit_cran('.')\"", depends-on = ["bootstrap"] }

[environments]
default = { features = [], solve-group = "default" }
publish = { features = ["publish"], solve-group = "default" }
